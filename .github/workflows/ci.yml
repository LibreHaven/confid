name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client (build/test/lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  signaling:
    name: signaling (vet/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: signaling/go.mod
          cache-dependency-path: signaling/go.sum
          cache: true
      - run: go vet ./...
      - run: go test ./...

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: [client, signaling]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: signaling/go.mod
          cache-dependency-path: signaling/go.sum
          cache: true
      # The Playwright webServer boots both services itself; client deps
      # must exist for `npm run dev` and Go modules for `go run`.
      - name: Install client deps
        run: npm ci
        working-directory: client
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E
        run: npx playwright test
        working-directory: e2e

  docker:
    name: docker (build image)
    runs-on: ubuntu-latest
    needs: [client, signaling]
    steps:
      - uses: actions/checkout@v5
      # Multi-stage build (node → golang → scratch) proves the Dockerfile
      # stays in sync with both codebases on every push.
      - name: Build image
        run: docker build -t confid:ci .
